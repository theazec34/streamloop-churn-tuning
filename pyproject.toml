[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "streamloop-churn-tuning"
version = "0.1.0"
description = "A reproducible churn-model tuning study using scikit-learn"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1,<2",
    "nbconvert>=7,<8",
]
test = [
    "pytest>=8,<9",
    "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
